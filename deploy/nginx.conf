# Included in the official image's http context.
# Only successful responses for hashed Vite assets receive immutable caching.
map "$status:$uri" $account_cache_control {
    default "no-cache";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /srv;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # All locations inherit these headers; avoid location-level add_header overrides.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $account_cache_control always;

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hash navigation needs no HTML fallback for missing files.
    location / {
        try_files $uri $uri/ =404;
    }
}
