name: pocket-expense
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
    image: pocket-expense-web:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      proxy:
        aliases:
          - "${APP_UPSTREAM:-pocket-expense-web}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  duckdns:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    restart: unless-stopped
    # The updater receives the token from .env; no privileged mode or capabilities.
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/duckdns/update.sh"]
    environment:
      DUCKDNS_SUBDOMAIN: "${DUCKDNS_SUBDOMAIN:?Set DUCKDNS_SUBDOMAIN in .env}"
      DUCKDNS_TOKEN: "${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in .env}"
    volumes:
      - ./deploy/duckdns-update.sh:/opt/duckdns/update.sh:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-mac-mini-proxy}"
